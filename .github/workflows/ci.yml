name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript libglib2.0-0 libgl1 libzbar0

      - name: Validate and install locked dependencies
        run: |
          uv lock --check
          uv sync --python 3.12 --frozen --extra dev

      - name: Audit locked dependencies
        run: uv run --python 3.12 --frozen --extra dev pip-audit

      - name: Lint
        run: uv run --python 3.12 --frozen --extra dev ruff check tests/test_dependency_security.py

      - name: Test
        run: uv run --python 3.12 --frozen --extra dev pytest -q

      - name: Smoke test CLI and build
        run: |
          uv run --python 3.12 --frozen papertrail --help
          uv build
