[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papertrail"
version = "0.2.0"
description = "AI-powered PDF document classification and organization using vision LLMs"
authors = [
    { name = "Employee Two", email = "eng.employee-two.silva@gmail.com" }
]
dependencies = [
    "openai",
    "PyMuPDF",
    "pandas",
    "pydantic",
    "pyyaml>=6.0",
    "openpyxl",
    "pillow",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "gradio>=5.0.0",
    "orjson>=3.9.0",
    "mbox-extractor",
    "pyzbar>=0.1.9",
    "pikepdf",
    "rich>=13.0.0",
    "typer>=0.9.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
similarity = ["cohere>=5.0", "numpy"]
dev = ["pytest"]

[project.scripts]
papertrail = "main:app"

[tool.hatch.build.targets.wheel]
include = [
    "main.py",
    "papertrail/**",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
