[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papertrail"
version = "0.2.0"
description = "AI-powered PDF document classification and organization using vision LLMs"
authors = [
    { name = "Employee Two", email = "eng.employee-two.silva@gmail.com" }
]
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn>=0.40.0",
    "unarch>=0.6.0",
    "openai",
    "PyMuPDF",
    "pandas",
    "pydantic",
    "pyyaml>=6.0.3",
    "openpyxl",
    "pillow>=13.0.0",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "gradio==7.0.0.dev0",
    "gradio-client==2.8.0.dev0",
    "orjson>=3.11.9",
    "mbox-extractor",
    "pyzbar>=0.1.9",
    "pikepdf",
    "pdfpress>=1.0.5",
    "rich>=15.0.0",
    "typer>=0.27.1",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.0.3",
    "ruff>=0.16.2",
]

[project.scripts]
papertrail = "main:app"

[tool.hatch.build.targets.wheel]
include = [
    "main.py",
    "papertrail/**",
    "tools/**",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
required-version = "==0.11.13"
exclude-newer = "7 days"
# Approved prereleases for the Pillow 13 security update.
exclude-newer-package = {gradio = "2026-11-09T22:31:16Z", gradio-client = "2026-11-09T22:31:28Z"}
constraint-dependencies = [
  "click>=8.3.3",
  "httplib2>=0.32.0",
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
  "brotli>=1.2.1",
  "brotlicffi>=1.2.1.0",
  "certifi>=2026.10.18",
  "filelock>=4.2.1",
  "google-auth>=2.62.1",
  "msgpack>=1.2.3",
  "oauthlib>=4.0.1",
  "pyasn1>=0.6.5",
]
